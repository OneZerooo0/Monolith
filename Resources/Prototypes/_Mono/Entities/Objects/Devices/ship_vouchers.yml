#LPC base (just different sprites)
- type: entity
  abstract: true
  parent: BaseShipVoucher
  id: BaseShipLPC
  name: ship LPC
  description: Contains the necessary data for a shipyard console to produce a certain design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/newlpc.rsi
    state: icon
  - type: ShipyardVoucher
    DestroyOnEmpty: false
    cooldown: 300 # five minutes

#Ironman Voucher
- type: entity
  parent: BaseShipVoucher
  id: ShipVoucherFrontierIronMan
  name: Ironman LPC
  description: Allows purchase of one free Baeg or Framework from the Shipyard. Destroyed on sale.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#e68e00"
    - state: screen6
      color: "#e68e00"
      shader: unshaded
  - type: ShipyardVoucher
    vessels:
    - Baeg
    - Framework
    consoleType: Shipyard
    DestroyOnEmpty: true

# Tsfmc

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherSpica
  name: TSF Spica LPC [T1]
  description: A small card that contains the data for the procurement of a Spica-class escort from the flagship's reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon
    - state: screen
      color: "#05ffff"
    - state: screen2
      color: "#05ffff"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 3600 # 30 minutes
    consoleType: Security
    companyName: TSF
    vessels:
    - Spica
  - type: StaticPrice
    vendPrice: 20000

