#LPC base (just different sprites)
- type: entity
  abstract: true
  parent: BaseShipVoucher
  id: BaseShipLPC
  name: ship LPC
  description: Contains the necessary data for a shipyard console to produce a certain design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/newlpc.rsi
    state: icon
  - type: ShipyardVoucher
    DestroyOnEmpty: false

#Ironman Voucher
- type: entity
  parent: BaseShipVoucher
  id: ShipVoucherFrontierIronMan
  name: Ironman Voucher
  description: Allows purchase of one free Baeg or Framework from the Shipyard. Destroyed on sale.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#e68e00"
    - state: screen6
      color: "#e68e00"
      shader: unshaded
  - type: ShipyardVoucher
    vessels:
    - Baeg
    - Framework
    consoleType: Shipyard

# Tsfmc
- type: entity
  parent: ShipVoucherNfsdBailiff
  id: ShipVoucherTsfmcColonel
  name: TSFMC colonel ship voucher
  description: Allows for two TSFMC ship purchases of any size, and allows for the procurement of a Polaris. Destroyed on sale.
  components:
  - type: ShipyardVoucher
    redemptionsLeft: 2
    access: # note - removed HOS/colonel access to prevent free flyssa (its only ship that uses HOS access, so it should be fine)
    - Armory
    - Sergeant
    - Bailiff
    - Security
    vessels:
    - Altair
    accessGroups:
    - GeneralNfsdAccess

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherFlyssa
  name: TSF flyssa LPC
  description: A small card that contains the data for the procurement of a Flyssa-class destroyer from the flagship's reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon
    - state: screen
      color: "#05ffff"
    - state: screen4
      color: "#05ffff"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Security
    companyName: TSF
    vessels:
    - Flyssa
  - type: StaticPrice
    vendPrice: 500000

