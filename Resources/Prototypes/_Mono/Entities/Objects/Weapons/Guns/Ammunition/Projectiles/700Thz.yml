# Mono Start - Changed types from hitscan to entity, components also changed
- type: entity
  id: Hitscan700Thz # Used as a parent for the cartridge's ammo capabilities, not actually fired
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 45
        Structural: 20
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: uv_muzzle_laser
    travelFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: uv_beam
    impactFlash:
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: uv_impact_laser
  - type: HitscanAmmo
    casingPrototype: BikeHorn
