- type: entity
  id: BaseCartridge700Thz
  name: cartridge (700Thz DEW)
  parent: [ BaseCartridge, BaseC1Contraband ] # Frontier: BaseSecurityContraband<BaseC1Contraband
  description: A small chemical-laser cell for use in Directed Energy Weapons. Capable of firing an intermediate pulsed laser.
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - Cartridge700Thz
  - type: HitscanAmmo
    casingPrototype: ChemicalSlop
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Casings/energy_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

- type: entity
  id: Cartridge700Thz
  name: cartridge (700Thz DEW)
  parent: [ BaseCartridge700Thz, Hitscan700Thz ]
  components:
  - type: HitscanAmmo
    casingPrototype: ChemicalSlop

- type: entity
  parent: BaseItem
  id: ChemicalSlop
  name: chemical slop
  description: According to 9 out of 10 doctors, this causes cancer. Seems to be disintegrating.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Casings/energy_casing.rsi
    state: pile
  - type: Tag
    tags:
    - Trash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Hydrogen
          Quantity: 5
        - ReagentId: Fluorine
          Quantity: 5
  - type: SolutionSpiker
    sourceSolution: food
    ignoreEmpty: true
  - type: ScoopableSolution
    solution: food
  - type: Extractable
    grindableSolutionName: food
  - type: TimedDespawn
    lifetime: 35
