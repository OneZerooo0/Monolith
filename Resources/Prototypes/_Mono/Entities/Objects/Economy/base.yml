- type: entity
  name: base economy item
  description: Used to keeo the ol' rust belt rolling.
  parent: BaseItem
  id: BaseEconomyGood
  components:
  - type: Tag
    tags:
    - EconomyGood
  - type: Item
    size: Normal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor1"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  name: base economy item
  description: Used to keeo the ol' rust belt rolling.
  parent: BaseEconomyGood
  id: BaseEconomyGoodTier1
  abstract: true
  suffix: T1
  components:
  - type: StaticPrice
